name: Refresh Single Place Photos From Provider

on:
  workflow_call:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'outscraper'
        type: string
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: string
      place_id:
        description: 'Google Maps Place ID'
        required: true
        type: string
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'outscraper'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: choice
        options:
          - 'charlotte'
      place_id:
        description: 'Google Maps Place ID'
        required: true
        type: string
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean

concurrency:
  group: refresh-single-place-photos-${{ inputs.place_id }}
  cancel-in-progress: true

jobs:
  refresh-single-place-photos:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Refresh Single Place Photos
        working-directory: ./scripts
        shell: pwsh
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          $providerType = [uri]::EscapeDataString("${{ inputs.provider_type }}")
          $city = [uri]::EscapeDataString("${{ inputs.city }}")
          $placeIdRaw = "${{ inputs.place_id }}"
          $placeId = [uri]::EscapeDataString($placeIdRaw)
          $dryRun = "${{ inputs.dry_run }}".ToLowerInvariant()

          if ([string]::IsNullOrWhiteSpace($placeIdRaw)) {
            Write-Error "place_id is required."
            exit 1
          }

          if ($dryRun -ne "true") {
            $dryRun = "false"
          }

          if ($dryRun -eq "true") {
            $upload = "false"
            $writeAirtable = "false"
          } else {
            $upload = "true"
            $writeAirtable = "true"
          }

          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/refresh-all-photos?provider_type=$providerType&city=$city&place_id=$placeId&dry_run=$dryRun&upload=$upload&write_airtable=$writeAirtable&try_url_variants=true"
          Write-Host "Using function URL: $FunctionUrl"

          ./Invoke-AzureDurableFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey "$Env:AZURE_FUNCTION_KEY" -TimeoutSeconds 1800
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  purge-orchestrations:
    needs: refresh-single-place-photos
    uses: ./.github/workflows/purge-orchestrations.yml
    secrets: inherit

  site-revalidation:
    needs: refresh-single-place-photos
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/site-revalidation.yml
    secrets: inherit