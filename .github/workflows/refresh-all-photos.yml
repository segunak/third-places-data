name: Refresh Photos From Selected Source

on:
  workflow_call:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: string
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: string
      place_id:
        description: 'Google Maps Place ID'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean
      max_places:
        description: 'Maximum Places'
        required: false
        default: ''
        type: string
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      photo_source_mode:
        description: 'Photo Source'
        required: false
        default: 'refresh_from_data_file_raw_data'
        type: string
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: choice
        options:
          - 'charlotte'
      place_id:
        description: 'Google Maps Place ID'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean
      max_places:
        description: 'Maximum Places'
        required: false
        default: ''
        type: string
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      photo_source_mode:
        description: 'Photo Source'
        required: false
        default: 'refresh_from_data_file_raw_data'
        type: choice
        options:
          - 'refresh_from_data_provider'
          - 'refresh_from_data_file_raw_data'
          - 'refresh_from_data_file_photo_urls'

concurrency: 
  group: refresh-all-photos
  cancel-in-progress: true

jobs:
  trigger-refresh-all-photos:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Invoke PowerShell Script
        id: invoke_script
        working-directory: ./scripts
        shell: pwsh
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          $providerType = "${{ inputs.provider_type }}"
          $city = "${{ inputs.city }}"
          $placeId = "${{ inputs.place_id }}"
          $dryRun = "${{ inputs.dry_run }}".ToLowerInvariant()
          $maxPlaces = "${{ inputs.max_places }}"
          $sequentialMode = "${{ inputs.sequential_mode }}".ToLowerInvariant()
          $photoSourceMode = "${{ inputs.photo_source_mode }}"
          
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/refresh-all-photos?provider_type=$providerType&city=$city&dry_run=$dryRun&sequential_mode=$sequentialMode&photo_source_mode=$photoSourceMode"

          if ($placeId -ne '') {
            $FunctionUrl += "&place_id=$placeId"
          }
          
          if ($maxPlaces -ne '') {
            $FunctionUrl += "&max_places=$maxPlaces"
          }
          
          Write-Host "Using function URL: $FunctionUrl"
          
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureDurableFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 1800

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check Script Result
        if: always()
        run: |
          echo "Script execution completed with status: ${{ steps.invoke_script.outcome }}"
          if ("${{ steps.invoke_script.outcome }}" -ne "success") {
            exit 1
          }

      - name: Purge Orchestrations
        if: always()
        shell: pwsh
        working-directory: ./scripts
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          Write-Host "Cleaning up completed orchestrations..."
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/purge-orchestrations"
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Orchestration purge failed, but this is non-critical."
          } else {
            Write-Host "Orchestration purge completed."
          }
