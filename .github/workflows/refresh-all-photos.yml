name: Refresh All Photos For View

on:
  workflow_call:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'outscraper'
        type: string
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: string
      view:
        description: 'Airtable View'
        required: true
        default: 'Production'
        type: string
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean
      max_places:
        description: 'Maximum Places'
        required: false
        default: ''
        type: string
      refresh_below:
        description: 'Refresh places with fewer Airtable photos than this value'
        required: true
        type: string
      batch_size:
        description: 'Places processed in parallel per batch'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'outscraper'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: choice
        options:
          - 'charlotte'
      view:
        description: 'Airtable View'
        required: true
        default: 'Production'
        type: choice
        options:
          - 'All'
          - 'Production'
          - 'Insufficient'
          - 'Coming Soon'
          - 'Archived'
          - 'Not Operational'
      dry_run:
        description: 'Dry Run'
        required: false
        default: false
        type: boolean
      max_places:
        description: 'Maximum Places'
        required: false
        default: ''
        type: string
      refresh_below:
        description: 'Refresh places with fewer Airtable photos than this value'
        required: true
        type: string
      batch_size:
        description: 'Places processed in parallel per batch'
        required: true
        type: string

concurrency: 
  group: refresh-all-photos
  cancel-in-progress: true

jobs:
  trigger-refresh-all-photos:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Invoke PowerShell Script
        working-directory: ./scripts
        shell: pwsh
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          $providerType = [uri]::EscapeDataString("${{ inputs.provider_type }}")
          $city = [uri]::EscapeDataString("${{ inputs.city }}")
          $view = [uri]::EscapeDataString("${{ inputs.view }}")
          $dryRun = "${{ inputs.dry_run }}".ToLowerInvariant()
          $maxPlaces = [uri]::EscapeDataString("${{ inputs.max_places }}")
          $refreshBelow = [uri]::EscapeDataString("${{ inputs.refresh_below }}")
          $batchSize = [uri]::EscapeDataString("${{ inputs.batch_size }}")
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/refresh-all-photos?provider_type=$providerType&city=$city&view=$view&dry_run=$dryRun&refresh_below=$refreshBelow&batch_size=$batchSize"
          
          if ($maxPlaces -ne '') {
            $FunctionUrl += "&max_places=$maxPlaces"
          }
          
          Write-Host "Using function URL: $FunctionUrl"
          
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureDurableFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 1800

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  purge-orchestrations:
    needs: trigger-refresh-all-photos
    uses: ./.github/workflows/purge-orchestrations.yml
    secrets: inherit

  site-revalidation:
    needs: trigger-refresh-all-photos
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/site-revalidation.yml
    secrets: inherit
