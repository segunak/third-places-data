          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/news-alerts.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.65"
          GH_AW_INFO_AWF_VERSION: "v0.27.11"
          GH_AW_INFO_ENGINE_ID: "copilot"
