name: Refresh Airtable Operational Statuses

on:
  workflow_call:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: string
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: string
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: choice
        options:
          - 'charlotte'

concurrency: 
  group: refresh-airtable-operational-statuses
  cancel-in-progress: true

jobs:
  trigger-refresh-operational-statuses:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Invoke PowerShell Script
        id: invoke_script
        shell: pwsh
        working-directory: ./scripts
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        continue-on-error: true
        run: |
          # The `|| 'value'` fallbacks are necessary because the `schedule` trigger
          # does not populate the `inputs` context — only `workflow_dispatch` and
          # `workflow_call` do. Without these, cron runs send empty query parameters.
          $providerType = "${{ inputs.provider_type || 'google' }}"
          $sequentialMode = "${{ inputs.sequential_mode || 'false' }}".ToLowerInvariant()
          $city = "${{ inputs.city || 'charlotte' }}"

          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/refresh-airtable-operational-statuses?provider_type=$providerType&sequential_mode=$sequentialMode&city=$city"
          
          Write-Host "Using function URL: $FunctionUrl"
          
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureDurableFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 1800

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure Function call failed."
            exit $LASTEXITCODE
          } else {
            Write-Output "Azure Function call succeeded."
          }

      - name: Check Script Result
        if: always()
        run: |
          echo "Script execution completed with status: ${{ steps.invoke_script.outcome }}"
          if ("${{ steps.invoke_script.outcome }}" -ne "success") {
            exit 1
          }

      - name: Purge Orchestrations
        if: always()
        shell: pwsh
        working-directory: ./scripts
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          Write-Host "Cleaning up completed orchestrations..."
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/purge-orchestrations"
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Orchestration purge failed, but this is non-critical."
          } else {
            Write-Host "Orchestration purge completed."
          }
