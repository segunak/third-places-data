name: Enrich Airtable Base

on:
  workflow_call:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: string
      photos_provider_type:
        description: 'Photo Provider'
        required: false
        default: 'google'
        type: string
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      force_refresh:
        description: 'Force Refresh'
        required: false
        default: false
        type: boolean
      view:
        description: 'Airtable View'
        required: false
        default: 'Insufficient'
        type: string
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: string
  workflow_dispatch:
    inputs:
      provider_type:
        description: 'Data Provider'
        required: false
        default: 'google'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      photos_provider_type:
        description: 'Photo Provider'
        required: false
        default: 'google'
        type: choice
        options:
          - 'google'
          - 'outscraper'
      sequential_mode:
        description: 'Sequential Mode'
        required: false
        default: false
        type: boolean
      force_refresh:
        description: 'Force Refresh'
        required: false
        default: false
        type: boolean
      view:
        description: 'Airtable View'
        required: false
        default: 'Insufficient'
        type: choice
        options:
          - 'All'
          - 'Production'
          - 'Insufficient'
          - 'Coming Soon'
          - 'Archived'
          - 'Not Operational'
      city:
        description: 'City'
        required: false
        default: 'charlotte'
        type: choice
        options:
          - 'charlotte'

# Ensures that only one instance of this workflow runs at a time
concurrency: 
  group: enrich-airtable-base
  cancel-in-progress: true

jobs:
  trigger-enrich-airtable-base:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Invoke PowerShell Script
        id: invoke_script
        shell: pwsh
        working-directory: ./scripts
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          $providerType = "${{ inputs.provider_type }}"
          $photosProviderType = "${{ inputs.photos_provider_type }}"
          $sequentialMode = "${{ inputs.sequential_mode }}".ToLowerInvariant()
          $forceRefresh = "${{ inputs.force_refresh }}".ToLowerInvariant()
          $view = "${{ inputs.view }}"
          $city = "${{ inputs.city }}"

          if ([string]::IsNullOrWhiteSpace($photosProviderType)) {
            $photosProviderType = $providerType
          }
          
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/enrich-airtable-base?provider_type=$providerType&photos_provider_type=$photosProviderType&sequential_mode=$sequentialMode&force_refresh=$forceRefresh&view=$view&city=$city"
          
          Write-Host "Using function URL: $FunctionUrl"
          
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureDurableFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 1800

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure Function call failed."
            exit $LASTEXITCODE
          } else {
            Write-Output "Azure Function call succeeded."
          }

      - name: Check Script Result
        if: always()
        run: |
          echo "Script execution completed with status: ${{ steps.invoke_script.outcome }}"
          if ("${{ steps.invoke_script.outcome }}" -ne "success") {
            exit 1
          }

      - name: Purge Orchestrations
        if: always()
        shell: pwsh
        working-directory: ./scripts
        env:
          AZURE_FUNCTION_KEY: ${{ secrets.AZURE_FUNCTION_KEY }}
        run: |
          Write-Host "Cleaning up completed orchestrations..."
          $FunctionUrl = "https://third-places-data.azurewebsites.net/api/purge-orchestrations"
          $FunctionKey = "$Env:AZURE_FUNCTION_KEY"
          ./Invoke-AzureFunction.ps1 -FunctionUrl $FunctionUrl -FunctionKey $FunctionKey -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Orchestration purge failed, but this is non-critical."
          } else {
            Write-Host "Orchestration purge completed."
          }
